<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wald & Wissenssystem</title>

<style>
body {
    font-family: monospace;
    background: #cfcfcf;
    margin: 0;
}

#chat {
    height: 92vh;
    overflow-y: auto;
    padding: 10px;
    border-bottom: 2px solid #888;
}

.msg {
    margin: 6px 0;
    white-space: pre-wrap;
    line-height: 1.4;
}

.user {
    color: #6b6b6b;
}

.bot {
    color: #1f4d3a;
}

.term {
    color: #1f4e79;
    background: #d7d7d7;
    padding: 1px 4px;
    border-radius: 4px;
    cursor: pointer;
}

.term:hover {
    background: #bfbfbf;
}

#input {
    width: 100%;
    padding: 12px;
    font-family: monospace;
    border: none;
    border-top: 2px solid #888;
    outline: none;
    background: #e6e6e6;
}
</style>
</head>

<body>

<div id="chat"></div>
<input id="input" placeholder="Frage eingeben und Enter drücken...">

<script>
let chat = JSON.parse(localStorage.getItem("chat") || "[]");

/* ------------------ WISSEN DE ------------------ */

const knowledge_de = {
    pflanze: "Pflanzen sind autotrophe Lebewesen. Sie betreiben Photosynthese.",
    photosynthese: "CO2 + Wasser + Licht → Glucose + Sauerstoff.",
    chlorophyll: "Chlorophyll ist der grüne Farbstoff für Photosynthese.",
    boden: "Boden besteht aus Mineralien, Humus, Wasser und Mikroorganismen.",
    ökosystem: "Ein Ökosystem besteht aus Lebewesen und ihrer Umwelt.",
    wald: "Ein Wald ist ein komplexes Ökosystem mit vielen Arten.",
    mykorrhiza: "Symbiose zwischen Pilzen und Pflanzenwurzeln.",
    biodiversität: "Biodiversität ist die Vielfalt von Arten und Ökosystemen.",
    zellatmung: "Zellatmung erzeugt Energie aus Glucose und Sauerstoff.",
    stickstoff: "Stickstoff ist wichtig für Pflanzenwachstum.",
    kohlenstoff: "Kohlenstoff ist Grundlage aller organischen Moleküle."
};

/* ------------------ WISSEN EN ------------------ */

const knowledge_en = {
    plant: "Plants are autotrophic organisms that produce energy via photosynthesis.",
    photosynthesis: "CO2 + water + light → glucose + oxygen.",
    ecosystem: "An ecosystem is a system of organisms interacting with their environment.",
    forest: "A forest is a complex ecosystem with many species.",
    soil: "Soil consists of minerals, organic matter, water and organisms.",
    biodiversity: "Biodiversity is the variety of life in ecosystems.",
    chlorophyll: "Chlorophyll is the green pigment used in photosynthesis.",
};

/* ------------------ WALDPFLANZEN ------------------ */

const forestPlants = [
"Buche","Eiche","Ahorn","Fichte","Tanne","Kiefer","Birke","Esche",
"Ulme","Lärche","Hasel","Eberesche","Weide","Linde","Hainbuche",
"Holunder","Schlehe","Himbeere","Brombeere","Moos","Farn",
"Wacholder","Douglasie","Waldmeister","Veilchen","Kastanie"
];

/* ------------------ PILZE ------------------ */

const mushrooms = {
    fliegenpilz: "Fliegenpilz ist giftig und rot mit weißen Punkten.",
    steinpilz: "Steinpilz ist ein essbarer Edelpilz.",
    champignon: "Champignon ist ein häufiger Speisepilz.",
    pfifferling: "Pfifferling ist gelb und essbar."
};

/* ------------------ IT ------------------ */

const it = {
    python: "Python ist eine einfache Programmiersprache für KI und Daten.",
    linux: "Linux ist ein Betriebssystem mit vielen Terminalbefehlen.",
    network: "Netzwerke bestehen aus IP, Router und DNS.",
    ls: "ls zeigt Dateien im Ordner.",
    cd: "cd wechselt den Ordner.",
    rm: "rm löscht Dateien."
};

/* ------------------ SPRACHE ------------------ */

function isEnglish(text) {
    const t = text.toLowerCase();

    const en = ["the","forest","plant","plants","mushroom","ecosystem","soil","tree","what","how","is","are"];
    const de = ["der","die","das","wald","pflanze","pflanzen","pilz","ökosystem","boden","baum","was","wie"];

    let enScore = en.filter(w => t.includes(w)).length;
    let deScore = de.filter(w => t.includes(w)).length;

    return enScore >= deScore;
}

/* ------------------ LINKIFY (STABIL) ------------------ */

function linkify(text, dict) {

    const keys = Object.keys(dict)
        .sort((a,b) => b.length - a.length)
        .join("|");

    const regex = new RegExp(`(^|[^a-zA-ZäöüÄÖÜ0-9])(${keys})(?=$|[^a-zA-ZäöüÄÖÜ0-9])`, "gi");

    return text.replace(regex, (match, pre, word) => {
        return `${pre}<span class="term" onclick="showInfo('${word.toLowerCase()}')">${word}</span>`;
    });
}

/* ------------------ CLICK INFO ------------------ */

function showInfo(key) {
    let msg =
        knowledge_de[key] ||
        knowledge_en[key] ||
        mushrooms[key] ||
        it[key];

    if (msg) {
        chat.push({role:"bot", text:"→ " + msg});
        save();
        render();
    }
}

/* ------------------ BOT ------------------ */

function reply(input) {
    const text = input.toLowerCase();
    const en = isEnglish(input);

    const dict = en ? knowledge_en : knowledge_de;

    // Pflanzen / Wald
    for (let k in dict) {
        if (text.includes(k)) return dict[k];
    }

    // Pilze
    for (let m in mushrooms) {
        if (text.includes(m)) return mushrooms[m];
    }

    // IT
    for (let i in it) {
        if (text.includes(i)) return it[i];
    }

    // Listen
    if (text.includes("waldpflanzen") || text.includes("forest plants")) {
        return en
            ? "Forest plants: " + forestPlants.join(", ")
            : "Waldpflanzen: " + forestPlants.join(", ");
    }

    return en
        ? "No knowledge available for this topic."
        : "Dazu habe ich kein Wissen hinterlegt.";
}

/* ------------------ CHAT ------------------ */

function save() {
    localStorage.setItem("chat", JSON.stringify(chat));
}

function render() {
    const c = document.getElementById("chat");
    c.innerHTML = "";

    for (let m of chat) {
        let text = m.text;

        if (m.role === "bot") {
            const dict = isEnglish(text) ? knowledge_en : knowledge_de;
            text = linkify(text, dict);
        }

        c.innerHTML += `<div class="msg ${m.role}">${text}</div>`;
    }

    c.scrollTop = c.scrollHeight;
}

function send(text) {
    if (!text) return;

    chat.push({role:"user", text});
    chat.push({role:"bot", text: reply(text)});

    save();
    render();
}

document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        send(e.target.value);
        e.target.value = "";
    }
});

render();
</script>

</body>
</html>
