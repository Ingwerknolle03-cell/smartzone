<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wald & Wissenssystem</title>

<style>
body {
    font-family: monospace;
    background: #dcdcdc;
    margin: 0;
}

#chat {
    height: 92vh;
    overflow-y: auto;
    padding: 10px;
    border-bottom: 2px solid #999;
}

.msg {
    margin: 6px 0;
    white-space: pre-wrap;
    line-height: 1.4;
}

/* klickbare Begriffe */
.term {
    color: darkblue;
    background: #cfe6ff;
    padding: 1px 4px;
    border-radius: 4px;
    cursor: pointer;
}
.term:hover {
    background: #a9d2ff;
}

#input {
    width: 100%;
    padding: 12px;
    font-family: monospace;
    border: none;
    border-top: 2px solid #999;
    outline: none;
    background: #f0f0f0;
}
</style>
</head>

<body>

<div id="chat"></div>
<input id="input" placeholder="Frage eingeben und Enter drücken...">

<script>
let chat = JSON.parse(localStorage.getItem("chat") || "[]");

/* ------------------ WISSEN ------------------ */

const knowledge = {
    pflanze: "Pflanzen sind autotrophe Lebewesen. Sie betreiben Photosynthese und erzeugen Energie aus Licht.",
    photosynthese: "Photosynthese: CO2 + Wasser + Licht → Glucose + Sauerstoff.",
    chlorophyll: "Chlorophyll ist der grüne Farbstoff der Pflanzen.",
    boden: "Boden besteht aus Mineralien, Humus, Wasser und Luft.",
    ökosystem: "Ein Ökosystem besteht aus Pflanzen, Tieren, Pilzen und Mikroorganismen.",
    mykorrhiza: "Mykorrhiza ist eine Symbiose zwischen Pilzen und Pflanzenwurzeln.",
    wald: "Ein Wald ist ein komplexes Ökosystem mit vielen Arten und Beziehungen.",
    pflanzenkrankheit: "Pflanzenkrankheiten entstehen durch Pilze, Bakterien oder Schädlinge."
};

/* ------------------ WALDPFLANZEN ------------------ */

const forestPlants = [
"Buche","Eiche","Ahorn","Fichte","Tanne",
"Kiefer","Birke","Esche","Ulme","Lärche",
"Hasel","Eberesche","Weide","Linde","Hainbuche",
"Holunder","Schlehe","Himbeere","Brombeere","Moos","Farn"
];

/* ------------------ PILZE ------------------ */

const mushrooms = {
    fliegenpilz: "Fliegenpilz: giftig, roter Hut mit weißen Punkten.",
    steinpilz: "Steinpilz: essbar, sehr beliebter Waldpilz.",
    champignon: "Champignon: essbarer Wiesenpilz."
};

/* ------------------ IT WISSEN ------------------ */

const it = {
    python: "Python ist eine Programmiersprache für KI, Daten und Automatisierung.",
    linux: "Linux ist ein Betriebssystem. Wichtige Befehle: ls, cd, mkdir, rm.",
    network: "Netzwerke bestehen aus IP, Router und DNS.",
    ls: "ls zeigt Dateien im Ordner.",
    cd: "cd wechselt den Ordner.",
    rm: "rm löscht Dateien."
};

/* ------------------ SPRACHE ------------------ */

function isEnglish(text) {
    const t = text.toLowerCase();

    const en = ["the","plant","forest","mushroom","what","how","is","are","soil","tree"];
    const de = ["der","die","das","pflanze","wald","pilz","was","wie","boden","baum"];

    let enScore = en.filter(w => t.includes(w)).length;
    let deScore = de.filter(w => t.includes(w)).length;

    return enScore >= deScore;
}

/* ------------------ LINKIFY ------------------ */

function linkify(text) {
    for (let k in knowledge) {
        const regex = new RegExp(`\\b${k}\\b`, "gi");

        text = text.replace(regex, match => {
            return `<span class="term" onclick="showInfo('${k}')">${match}</span>`;
        });
    }
    return text;
}

function showInfo(key) {
    let text = knowledge[key];
    if (!text) return;

    chat.push({role:"bot", text:"🔎 " + text});
    save();
    render();
}

/* ------------------ LOGIK ------------------ */

function reply(input) {
    const text = input.toLowerCase();
    const en = isEnglish(input);

    /* SMALLTALK */
    if (text.includes("hallo") || text.includes("hi") || text.includes("hello")) {
        return en
            ? "I am your forest and plant knowledge assistant."
            : "Ich bin dein Wald- und Pflanzen-Wissensassistent.";
    }

    /* EXAKTE IT BEFEHLE */
    if (text === "ls") return it.ls;
    if (text === "cd") return it.cd;
    if (text === "rm") return it.rm;

    /* PFLANZEN THEMA */
    if (text.includes("pflanze") || text.includes("plant")) {
        return knowledge.pflanze;
    }

    if (text.includes("photosynthese") || text.includes("photosynthesis")) {
        return knowledge.photosynthese;
    }

    if (text.includes("wald") || text.includes("forest")) {
        return knowledge.wald;
    }

    if (text.includes("ökosystem") || text.includes("ecosystem")) {
        return knowledge.ökosystem;
    }

    if (text.includes("mykorrhiza")) {
        return knowledge.mykorrhiza;
    }

    /* WALDPFLANZEN LISTE */
    if (text.includes("waldpflanzen") || text.includes("forest plants")) {
        return "Waldpflanzen: " + forestPlants.join(", ");
    }

    /* PILZE */
    for (let m in mushrooms) {
        if (text.includes(m)) return mushrooms[m];
    }

    /* IT */
    for (let k in it) {
        if (text.includes(k)) return it[k];
    }

    return en
        ? "No specific knowledge found. Try plants, forest, mushrooms or IT topics."
        : "Dazu habe ich kein spezifisches Wissen hinterlegt.";
}

/* ------------------ CHAT ------------------ */

function save() {
    localStorage.setItem("chat", JSON.stringify(chat));
}

function render() {
    const c = document.getElementById("chat");
    c.innerHTML = "";

    for (let m of chat) {
        let text = m.text;

        if (m.role === "bot") {
            text = linkify(text);
        }

        c.innerHTML += `<div class="msg">${text}</div>`;
    }

    c.scrollTop = c.scrollHeight;
}

function send(text) {
    if (!text) return;

    chat.push({role:"user", text});
    chat.push({role:"bot", text: reply(text)});

    save();
    render();
}

/* ------------------ INPUT ------------------ */

document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        send(e.target.value);
        e.target.value = "";
    }
});

render();
</script>

</body>
</html>
