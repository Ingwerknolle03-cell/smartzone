<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wald & Wissenssystem</title>

<style>
body {
    font-family: monospace;
    background: #cfcfcf; /* grauer */
    margin: 0;
}

#chat {
    height: 92vh;
    overflow-y: auto;
    padding: 10px;
    border-bottom: 2px solid #888;
}

.msg {
    margin: 6px 0;
    white-space: pre-wrap;
    line-height: 1.4;
    color: #222;
}

/* dezenter als vorher */
.term {
    color: #1f4e79;
    background: #d7d7d7;
    padding: 1px 4px;
    border-radius: 4px;
    cursor: pointer;
}

.term:hover {
    background: #bfbfbf;
}

#input {
    width: 100%;
    padding: 12px;
    font-family: monospace;
    border: none;
    border-top: 2px solid #888;
    outline: none;
    background: #e6e6e6;
}
</style>
</head>

<body>

<div id="chat"></div>
<input id="input" placeholder="Frage eingeben und Enter drücken...">

<script>
let chat = JSON.parse(localStorage.getItem("chat") || "[]");

/* ------------------ WISSEN ------------------ */

const knowledge = {
    pflanze: "Pflanzen sind autotrophe Lebewesen. Sie betreiben Photosynthese.",
    photosynthese: "CO2 + Wasser + Licht → Glucose + Sauerstoff.",
    chlorophyll: "Chlorophyll ist der grüne Farbstoff der Pflanzen.",
    boden: "Boden besteht aus Mineralien, Humus, Wasser und Luft.",
    ökosystem: "Ein Ökosystem besteht aus allen Lebewesen und ihrer Umwelt.",
    mykorrhiza: "Symbiose zwischen Pilzen und Pflanzenwurzeln.",
    wald: "Ein Wald ist ein komplexes Ökosystem."
};

/* ------------------ LISTEN ------------------ */

const forestPlants = [
"Buche","Eiche","Ahorn","Fichte","Tanne",
"Kiefer","Birke","Esche","Ulme","Lärche",
"Hasel","Eberesche","Weide","Linde","Hainbuche",
"Holunder","Schlehe","Himbeere","Brombeere","Moos","Farn"
];

/* ------------------ SPRACHE ------------------ */

function isEnglish(text) {
    const t = text.toLowerCase();

    const en = ["the","plant","forest","mushroom","what","how","is","are","soil","tree","ecosystem","photosynthesis"];
    const de = ["der","die","das","pflanze","wald","pilz","was","wie","boden","baum","ökosystem","photosynthese"];

    let enScore = en.filter(w => t.includes(w)).length;
    let deScore = de.filter(w => t.includes(w)).length;

    return enScore >= deScore;
}

/* ------------------ NUR LETZTES HIGHLIGHT ------------------ */

function linkifyLastOnly(text) {
    let result = text;

    for (let key in knowledge) {
        const regex = new RegExp(`\\b${key}\\b`, "gi");

        let matches = [...result.matchAll(regex)];
        if (matches.length > 1) {
            // alle ersetzen außer letztes Vorkommen entfernen Markierung
            let lastIndex = matches[matches.length - 1].index;

            let i = 0;
            result = result.replace(regex, match => {
                let current = i;
                i++;

                if (current === matches.length - 1) {
                    return `<span class="term" onclick="showInfo('${key}')">${match}</span>`;
                }
                return match;
            });
        } else {
            result = result.replace(regex, match =>
                `<span class="term" onclick="showInfo('${key}')">${match}</span>`
            );
        }
    }

    return result;
}

/* ------------------ CLICK INFO ------------------ */

function showInfo(key) {
    chat.push({role:"bot", text:"→ " + knowledge[key]});
    save();
    render();
}

/* ------------------ BOT LOGIK ------------------ */

function reply(input) {
    const text = input.toLowerCase();
    const en = isEnglish(input);

    if (text.includes("hallo") || text.includes("hi") || text.includes("hello")) {
        return en
            ? "I am your forest and plant assistant."
            : "Ich bin dein Wald- und Pflanzenassistent.";
    }

    if (text.includes("pflanze") || text.includes("plant")) return knowledge.pflanze;
    if (text.includes("photosynthese") || text.includes("photosynthesis")) return knowledge.photosynthese;
    if (text.includes("wald") || text.includes("forest")) return knowledge.wald;
    if (text.includes("ökosystem") || text.includes("ecosystem")) return knowledge.ökosystem;
    if (text.includes("mykorrhiza")) return knowledge.mykorrhiza;

    if (text.includes("waldpflanzen") || text.includes("forest plants")) {
        return en
            ? "Forest plants: " + forestPlants.join(", ")
            : "Waldpflanzen: " + forestPlants.join(", ");
    }

    return en
        ? "No knowledge available for this topic."
        : "Dazu habe ich kein Wissen hinterlegt.";
}

/* ------------------ CHAT ------------------ */

function save() {
    localStorage.setItem("chat", JSON.stringify(chat));
}

function render() {
    const c = document.getElementById("chat");
    c.innerHTML = "";

    for (let m of chat) {
        let text = m.text;

        if (m.role === "bot") {
            text = linkifyLastOnly(text);
        }

        c.innerHTML += `<div class="msg">${text}</div>`;
    }

    c.scrollTop = c.scrollHeight;
}

function send(text) {
    if (!text) return;

    chat.push({role:"user", text});
    chat.push({role:"bot", text: reply(text)});

    save();
    render();
}

document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        send(e.target.value);
        e.target.value = "";
    }
});

render();
</script>

</body>
</html>
