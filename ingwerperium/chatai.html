<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wald & Wissenssystem</title>

<style>
body {
    font-family: monospace;
    background: #cfcfcf;
    margin: 0;
}

#chat {
    height: 92vh;
    overflow-y: auto;
    padding: 10px;
    border-bottom: 2px solid #888;
}

.msg {
    margin: 6px 0;
    white-space: pre-wrap;
    line-height: 1.4;
}

.user {
    color: #6b6b6b;
}

.bot {
    color: #1f4d3a;
}

/* klickbare Begriffe */
.term {
    color: #1f4e79;
    background: #d7d7d7;
    padding: 1px 4px;
    border-radius: 4px;
    cursor: pointer;
}
.term:hover {
    background: #bfbfbf;
}

#input {
    width: 100%;
    padding: 12px;
    font-family: monospace;
    border: none;
    border-top: 2px solid #888;
    outline: none;
    background: #e6e6e6;
}
</style>
</head>

<body>

<div id="chat"></div>
<input id="input" placeholder="Frage eingeben und Enter drücken...">

<script>
let chat = JSON.parse(localStorage.getItem("chat") || "[]");

/* ------------------ WISSEN ------------------ */

const knowledge = {
    pflanze: "Pflanzen sind autotrophe Lebewesen. Sie betreiben Photosynthese und erzeugen Energie aus Licht.",
    photosynthese: "CO2 + Wasser + Licht → Glucose + Sauerstoff.",
    chlorophyll: "Chlorophyll ist der grüne Farbstoff der Pflanzen und zentral für Photosynthese.",
    boden: "Boden besteht aus Mineralien, Humus, Wasser, Luft und Mikroorganismen.",
    ökosystem: "Ein Ökosystem besteht aus Lebewesen und ihrer Umwelt in ständiger Wechselwirkung.",
    wald: "Ein Wald ist ein komplexes Ökosystem mit vielen Tier- und Pflanzenarten.",
    mykorrhiza: "Symbiose zwischen Pilzen und Pflanzenwurzeln zur besseren Nährstoffaufnahme.",
    biodiversität: "Biodiversität beschreibt die Vielfalt von Arten, Genen und Ökosystemen.",
    zellatmung: "Zellatmung: Glucose + Sauerstoff → Energie + CO2 + Wasser.",
    pflanzenwachstum: "Pflanzenwachstum hängt von Licht, Wasser, Temperatur und Nährstoffen ab.",
    stickstoffkreislauf: "Der Stickstoffkreislauf beschreibt die Umwandlung von Stickstoff in der Natur.",
    kohlenstoffkreislauf: "Der Kohlenstoffkreislauf beschreibt die Bewegung von Kohlenstoff zwischen Atmosphäre und Biosphäre."
};

/* ------------------ WALDPFLANZEN ------------------ */

const forestPlants = [
"Buche","Eiche","Ahorn","Fichte","Tanne",
"Kiefer","Birke","Esche","Ulme","Lärche",
"Hasel","Eberesche","Weide","Linde","Hainbuche",
"Holunder","Schlehe","Himbeere","Brombeere","Moos","Farn",
"Wacholder","Douglasie","Rotbuche","Waldmeister","Veilchen"
];

/* ------------------ PILZE ------------------ */

const mushrooms = {
    fliegenpilz: "Fliegenpilz: giftig, rot mit weißen Punkten.",
    steinpilz: "Steinpilz: essbar, sehr wertvoller Speisepilz.",
    champignon: "Champignon: häufig, essbar."
};

/* ------------------ IT ------------------ */

const it = {
    python: "Python ist eine Programmiersprache für KI, Datenanalyse und Automatisierung.",
    linux: "Linux ist ein Betriebssystem. Wichtige Befehle: ls, cd, rm, mkdir.",
    network: "Netzwerke bestehen aus IP, Router, DNS und Datenpaketen.",
    ls: "ls zeigt Dateien im aktuellen Verzeichnis.",
    cd: "cd wechselt das Verzeichnis.",
    rm: "rm löscht Dateien (vorsichtig)."
};

/* ------------------ SPRACHE ------------------ */

function isEnglish(text) {
    const t = text.toLowerCase();

    const en = ["the","plant","forest","mushroom","what","how","is","are","soil","tree","ecosystem","photosynthesis","cycle"];
    const de = ["der","die","das","pflanze","wald","pilz","was","wie","boden","baum","ökosystem","photosynthese","kreislauf"];

    let enScore = en.filter(w => t.includes(w)).length;
    let deScore = de.filter(w => t.includes(w)).length;

    return enScore >= deScore;
}

/* ------------------ STABILES LINKIFY ------------------ */

function linkify(text) {

    const keys = Object.keys(knowledge)
        .sort((a,b) => b.length - a.length)
        .join("|");

    const regex = new RegExp(`(^|[^a-zA-ZäöüÄÖÜ0-9])(${keys})(?=$|[^a-zA-ZäöüÄÖÜ0-9])`, "gi");

    return text.replace(regex, (match, pre, word) => {
        return `${pre}<span class="term" onclick="showInfo('${word.toLowerCase()}')">${word}</span>`;
    });
}

/* ------------------ CLICK INFO ------------------ */

function showInfo(key) {
    chat.push({role:"bot", text:"→ " + knowledge[key]});
    save();
    render();
}

/* ------------------ BOT ------------------ */

function reply(input) {
    const text = input.toLowerCase();
    const en = isEnglish(input);

    if (text.includes("hallo") || text.includes("hi") || text.includes("hello")) {
        return en
            ? "I am your forest and ecology assistant."
            : "Ich bin dein Wald- und Ökosystem-Assistent.";
    }

    if (text.includes("pflanze") || text.includes("plant")) return knowledge.pflanze;
    if (text.includes("photosynthese") || text.includes("photosynthesis")) return knowledge.photosynthese;
    if (text.includes("wald") || text.includes("forest")) return knowledge.wald;
    if (text.includes("ökosystem") || text.includes("ecosystem")) return knowledge.ökosystem;
    if (text.includes("mykorrhiza")) return knowledge.mykorrhiza;

    if (text.includes("waldpflanzen") || text.includes("forest plants")) {
        return en
            ? "Forest plants: " + forestPlants.join(", ")
            : "Waldpflanzen: " + forestPlants.join(", ");
    }

    for (let m in mushrooms) {
        if (text.includes(m)) return mushrooms[m];
    }

    for (let k in it) {
        if (text.includes(k)) return it[k];
    }

    return en
        ? "No knowledge available for this topic."
        : "Dazu habe ich kein Wissen hinterlegt.";
}

/* ------------------ CHAT ------------------ */

function save() {
    localStorage.setItem("chat", JSON.stringify(chat));
}

function render() {
    const c = document.getElementById("chat");
    c.innerHTML = "";

    for (let m of chat) {
        let text = m.text;

        if (m.role === "bot") {
            text = linkify(text);
        }

        c.innerHTML += `<div class="msg ${m.role}">${text}</div>`;
    }

    c.scrollTop = c.scrollHeight;
}

function send(text) {
    if (!text) return;

    chat.push({role:"user", text});
    chat.push({role:"bot", text: reply(text)});

    save();
    render();
}

document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        send(e.target.value);
        e.target.value = "";
    }
});

render();
</script>

</body>
</html>
