<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Forest & Plant Knowledge Bot</title>

<style>
body {
    font-family: monospace;
    background: #dcdcdc;
    margin: 0;
}

#chat {
    height: 92vh;
    overflow-y: auto;
    padding: 10px;
    border-bottom: 2px solid #999;
}

.msg {
    margin: 6px 0;
    white-space: pre-wrap;
}

.user { color: navy; }
.bot { color: darkgreen; }

#input {
    width: 100%;
    padding: 12px;
    font-family: monospace;
    border: none;
    border-top: 2px solid #999;
    outline: none;
    background: #f0f0f0;
}
</style>
</head>

<body>

<div id="chat"></div>
<input id="input" placeholder="Frage eingeben und Enter drücken...">

<script>
let chat = JSON.parse(localStorage.getItem("chat") || "[]");

function save() {
    localStorage.setItem("chat", JSON.stringify(chat));
}

function render() {
    const c = document.getElementById("chat");
    c.innerHTML = "";
    for (let m of chat) {
        c.innerHTML += `<div class="msg ${m.role}"><b>${m.role}:</b> ${m.text}</div>`;
    }
    c.scrollTop = c.scrollHeight;
}

/* ------------------- SPRACHERKENNUNG ------------------- */

function isEnglish(text) {
    const t = text.toLowerCase();

    const enWords = ["the", "plant", "tree", "forest", "mushroom", "what", "how", "why", "is", "are", "soil"];
    const deWords = ["der", "die", "das", "pflanze", "baum", "wald", "pilz", "was", "wie", "warum", "boden"];

    let en = enWords.filter(w => t.includes(w)).length;
    let de = deWords.filter(w => t.includes(w)).length;

    return en >= de;
}

/* ------------------- WISSEN ------------------- */

const plants = {
    general: {
        de: "Pflanzen sind autotrophe Organismen. Sie betreiben Photosynthese und erzeugen Energie aus Licht.",
        en: "Plants are autotrophic organisms. They perform photosynthesis and produce energy from light."
    },
    photosynthesis: {
        de: "Photosynthese: CO2 + Wasser + Licht → Zucker + Sauerstoff.",
        en: "Photosynthesis: CO2 + water + light → glucose + oxygen."
    },
    soil: {
        de: "Boden besteht aus Mineralien, Humus, Wasser und Luft.",
        en: "Soil consists of minerals, humus, water and air."
    },
    ecosystem: {
        de: "Ein Ökosystem besteht aus Pflanzen, Tieren, Pilzen und Mikroorganismen.",
        en: "An ecosystem consists of plants, animals, fungi and microorganisms."
    }
};

/* ------------------- WALDPFLANZEN (ERWEITERT) ------------------- */

const forestPlants = [
"Buche", "Eiche", "Ahorn", "Fichte", "Tanne",
"Kiefer", "Birke", "Hasel", "Eberesche", "Weide",
"Esche", "Ulme", "Lärche", "Hainbuche", "Holunder",
"Schlehe", "Himbeere", "Brombeere", "Moos", "Farn",
"Linde", "Rotbuche", "Douglasie", "Wacholder"
];

/* ------------------- PILZE ------------------- */

const mushrooms = {
    fliegenpilz: {
        de: "Fliegenpilz: giftig, roter Hut mit weißen Punkten.",
        en: "Fly agaric: poisonous mushroom with red cap and white spots."
    },
    steinpilz: {
        de: "Steinpilz: essbar, wächst unter Bäumen.",
        en: "Porcini mushroom: edible, grows under trees."
    },
    champignon: {
        de: "Champignon: essbarer Wiesenpilz.",
        en: "Button mushroom: edible meadow mushroom."
    }
};

/* ------------------- EXTRA WISSEN ------------------- */

const extra = {
    licht: {
        de: "Licht ist die Energiequelle der Photosynthese.",
        en: "Light is the energy source for photosynthesis."
    },
    wurzel: {
        de: "Wurzeln nehmen Wasser und Nährstoffe auf.",
        en: "Roots absorb water and nutrients."
    },
    chlorophyll: {
        de: "Chlorophyll ist der grüne Farbstoff der Pflanzen.",
        en: "Chlorophyll is the green pigment in plants."
    },
    mykorrhiza: {
        de: "Symbiose zwischen Pilzen und Pflanzenwurzeln.",
        en: "Symbiosis between fungi and plant roots."
    },
    wald: {
        de: "Ein Wald ist ein komplexes Ökosystem.",
        en: "A forest is a complex ecosystem."
    },
    baum: {
        de: "Ein Baum ist eine große Holzpflanze mit Stamm.",
        en: "A tree is a large woody plant with a trunk."
    }
};

/* ------------------- LOGIK ------------------- */

function findAnswer(text) {
    const t = text.toLowerCase();
    const en = isEnglish(text);

    // Pflanzen allgemein
    for (let k in plants) {
        if (t.includes(k)) return plants[k][en ? "en" : "de"];
    }

    // Waldpflanzen
    for (let p of forestPlants) {
        if (t.includes(p.toLowerCase())) {
            return en
                ? `${p} is a common forest plant in Central Europe.`
                : `${p} ist eine typische Waldpflanze in Mitteleuropa.`;
        }
    }

    // Pilze
    for (let m in mushrooms) {
        if (t.includes(m)) return mushrooms[m][en ? "en" : "de"];
    }

    // Extra Wissen
    for (let k in extra) {
        if (t.includes(k)) return extra[k][en ? "en" : "de"];
    }

    // Listen
    if (t.includes("waldpflanzen") || t.includes("forest plants")) {
        return en
            ? "Forest plants: " + forestPlants.join(", ")
            : "Waldpflanzen: " + forestPlants.join(", ");
    }

    return en
        ? "I don't have specific knowledge about this yet. Try plants, forest, mushrooms or ecology."
        : "Dazu habe ich kein spezifisches Wissen. Frag nach Pflanzen, Wald, Pilzen oder Ökologie.";
}

/* ------------------- CHAT ------------------- */

function send(text) {
    if (!text) return;

    chat.push({role:"user", text});
    chat.push({role:"bot", text: findAnswer(text)});

    save();
    render();
}

document.getElementById("input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        send(this.value);
        this.value = "";
    }
});

render();
</script>

</body>
</html>
